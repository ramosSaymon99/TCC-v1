name = "techgest"
main = "worker/index.js"
compatibility_date = "2025-09-01"

# Publica no endereço público https://techgest.<sua-conta>.workers.dev
workers_dev = true
preview_urls = true

# Gera o index.html (app inteiro em um arquivo) antes de cada deploy, inclusive no Workers Builds
[build]
command = "npm run build:single"

# O app (arquivo único index.html) é servido como asset estático
[assets]
directory = "./cloudflare-dist"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "techgest-db"
database_id = "fb14cdf8-e27a-45fd-97b0-2a4ed594cd0d"
