name = "aurom-tech"
main = "worker/index.js"
compatibility_date = "2025-09-01"

# Publica em https://aurom-tech.<sua-conta>.workers.dev
workers_dev = true
preview_urls = true

# O site (public/index.html) é servido como asset estático; só /api/* passa pelo Worker
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

# Mesmo banco do TechGest: cada pedido do site vira um lead no Funil Comercial
[[d1_databases]]
binding = "DB"
database_name = "techgest-db"
database_id = "fb14cdf8-e27a-45fd-97b0-2a4ed594cd0d"
